<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBRAREPORT - Seguridad en Obra (TRAGSA)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tragsa: {
                            50: '#f0fdf4',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf para exportar informe oficial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Corporativo -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-tragsa-600 p-2.5 rounded-lg text-white shadow">
                    <i class="fa-solid fa-hard-hat text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">OBRAREPORT <span class="text-xs bg-tragsa-600 px-2 py-0.5 rounded text-white ml-2">Grupo TRAGSA</span></h1>
                    <p class="text-xs text-slate-400">Sistema de Control y Prevención de Riesgos Laborales en Obra</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="guardarBorrador()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-floppy-disk text-emerald-400"></i> Guardar Borrador
                </button>
                <button onclick="abrirCargador()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-folder-open text-blue-400"></i> Cargar Guardados
                </button>
                <button onclick="resetForm()" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 text-xs px-3 py-2 rounded-lg border border-red-800 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-right"></i> Nuevo
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-7xl w-full mx-auto px-4 py-6 flex-grow">
        <form id="obraReportForm" class="space-y-6">

            <!-- 1. DATOS IDENTIFICATIVOS -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex items-center justify-between border-b pb-3 mb-4">
                    <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span class="bg-tragsa-600 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">1</span>
                        Datos Identificativos de la Visita
                    </h2>
                    <span class="text-xs text-slate-500 font-medium">Metadatos de inspección</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Código de Obra *</label>
                        <input type="text" id="codObra" required class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Ej: TRG-2026-048">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre de la Obra *</label>
                        <input type="text" id="nombreObra" required class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Ej: Acondicionamiento Margen Fluvial">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Técnico de PRL *</label>
                        <input type="text" id="tecnicoPrl" required class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Nombre del Técnico">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Tipo de Visita *</label>
                        <select id="tipoVisita" class="w-full text-sm border border-slate-300 rounded-lg p-2 bg-white focus:ring-2 focus:ring-tragsa-600 outline-none">
                            <option value="Visita de seguridad (Gerente)">Visita de seguridad (Gerente)</option>
                            <option value="IPS (Jefe de obra / asimilados)">IPS (Jefe de obra / asimilados)</option>
                            <option value="V_TPRL" selected>V_TPRL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Jefe de Obra *</label>
                        <input type="text" id="jefeObra" required class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Nombre del Jefe de Obra">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Objeto de la Visita</label>
                        <input type="text" id="objetoVisita" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Ej: Inspección rutinaria trimestral">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Lugar de la Visita y Ubicación GPS</label>
                        <div class="flex gap-2">
                            <input type="text" id="lugarVisita" class="flex-grow text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Dirección / Km / Coordenadas GPS">
                            <button type="button" onclick="capturarGPS()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1 shrink-0">
                                <i class="fa-solid fa-location-crosshairs text-emerald-400"></i> Capturar GPS
                            </button>
                        </div>
                    </div>
                    <div class="sm:col-span-1">
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Asistentes a la Obra</label>
                        <input type="text" id="asistentes" class="w-full text-sm border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-tragsa-600 outline-none" placeholder="Nombres de asistentes">
                    </div>
                </div>
            </section>

            <!-- 2. INSTALACIONES DE OBRA -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex items-center justify-between border-b pb-3 mb-4">
                    <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span class="bg-tragsa-600 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">2</span>
                        Instalaciones de Obra
                    </h2>
                    <span class="text-xs text-slate-500 font-medium">Estado general de bienestar</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-
